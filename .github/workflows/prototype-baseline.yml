name: Prototype baseline

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  baseline:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download a 1,000-patient development sample
        run: python scripts/download_sample.py --n 1000

      - name: Build sliding-window dataset
        run: python src/build_dataset.py

      - name: Train interpretable baseline
        run: python src/baseline.py | tee baseline_metrics.txt

      - name: Save development artifacts
        uses: actions/upload-artifact@v4
        with:
          name: prototype-baseline
          path: |
            baseline_metrics.txt
            data/processed/sepsis_windows.csv
